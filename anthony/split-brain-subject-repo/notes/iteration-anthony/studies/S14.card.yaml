id: S14
title: Remove the template's reading directions
owner: A (j-lens-mean-2e), night-2
status: finalist
question: >
  Can the family mean's work be done by removing $h$'s component in the lens's reading directions of a fixed list of
  template tokens, $g(h) = P_B h$ with $B = \mathrm{span}\{J^{\top} W_U[t] / \|J^{\top} W_U[t]\| : t \in T\}$, using no
  reference cell and no family label?
verdict: >
  Yes, and it is the night's label-free finalist once a partial neighbour mean is added late. Removing the reading
  directions of 64 template tokens (s14t64, no reference cells) matches fam and keeps the shared units a mean removes
  (multilingual_mt language 0.92, multihop_mt bridge2). S14bL (a k-means cluster mean up to L40; above it, the template
  projection of h minus half its 8 nearest other-carrier, other-language fit cells) reads val strict +0.060 cos / +0.062 rms
  vs fam with the guardrail ok, judged multilingual_mt at fam's level, and +0.052 / +0.046 on a registered read of the
  fresh val2 split. Its bench read is registered, not run.
tiles:
  - {label: "val strict, S14bL vs fam (cos / rms)", value: "+0.060 / +0.062", sub: "guardrail ok both; judged multilingual_mt = fam"}
  - {label: "fresh val2 + val3 pooled (607 items), S14bL vs fam", value: "+0.039", sub: "[+0.018, +0.059]; val2 +0.052, val3 +0.023; supervised S20x +0.051"}
  - {label: "bench strict (registered, one read), S14b / S14k", value: "+0.022 / +0.020", sub: "S14b guardrail ok; S14bL not read"}
  - {label: "val Haiku multilingual_mt, s14t64", value: "0.453", sub: "fam 0.340, pco16 / knnx8 0.226; language unit 0.92"}
formulas:
  - latex: 'h - g(h) = (I - B B^{\top}) h, \quad B = \mathrm{orth}\{ J_l^{\top} W_U[t] / \|J_l^{\top} W_U[t]\| : t \in T_{1..k} \}'
    note: "s14t<k>: T the template token list (chat specials, strings the decoded family means share, frequent chat tokens; never a target); for t in T the cos score becomes exactly 0."
  - latex: 'h - g(h) = h - \mu_{\text{clu}(h)} \ (l \le 40), \qquad h - g(h) = (I - B B^{\top})(h - \alpha\, \mu_{\text{clu}(h)}) \ (l > 40)'
    note: "S14b: alpha = 0.5 chosen on fit (alpha = 0 is S14k)."
  - latex: 'g(h) = \mu_{\text{clu}(h)} \ (l \le 40), \qquad g(h) = B B^{\top} h \ (l > 40)'
    note: "sched:40:kmx64+s14t64: the cell's k-means cluster mean over fit read cells (k = 64, no family label; S4) up to L40, the template subspace above; L chosen on fit. sched:40:fam+s14t64 uses the family mean early."
