insights:
  - {lead: "A subspace fixed by template tokens does the family mean's work", text: "s14t64 +0.095 over zero on fit (fam +0.092), val +0.089 (fam +0.080); random subspaces +0.00; the removed part decodes to the template strings (这句话, 什么意思, full-width punctuation)."}
  - {lead: "It keeps the shared units a mean removes", text: "Judged on val: multilingual_mt language 0.92 (fam 0.79, pco16 0.60), concept 0.75; multihop_mt bridge2 0.44 (fam 0.00): T holds no category and no language, so it cannot subtract them."}
  - {lead: "Its cost is the instruction's genre prior", text: "On association s14t64's top 10 turns from content to story openers at L52-60 ('Suddenly, She, whispered'); fam removes that family-shared prior, T does not."}
  - {lead: "Both effects are late: the late centre decides the trade", text: "X early + s14t64 late lands at +0.015-0.023 on fit for X = fam, kmx64, knnx8, pco16; the predicted order (s14t64 early, fam late) only equals fam. On val the label-free kmx64 version is +0.032 and passes the guardrail (association -0.06 inside its interval)."}
  - {lead: "Which tokens matters", text: "Decomposition of the gain over zero (fit): any tokens' reading directions +0.03 (quotation / apostrophe form), chat-frequent tokens +0.06, the lens's own chat readout +0.077, template strings +0.095; the vocabulary-wide top reading directions carry content (-0.04 at k = 128)."}
  - {lead: "Half the cluster mean late is a dial between the two", text: "S14b: alpha 0 -> 1 trades the _mt units for association / UM; alpha 0.5 keeps both (val strict +0.043, judged _mt 0.462 = alpha 0's 0.461); random-membership clusters as the mean do not recover association."}
  - {lead: "A quarter of the fit pool is enough", text: "S14n: kmx64 from 25 % of the fit groups (~16 items per family) reads val +0.035 / +0.043 / +0.048 over three draws (full pool +0.043), guardrail ok; at 10 % association goes first."}
  - {lead: "A constant shift is half of it", text: "Pulling back an indicator of the same 64 tokens (S13t) reaches +0.048 over zero at best: the projection's per-cell adaptivity is the other half."}
