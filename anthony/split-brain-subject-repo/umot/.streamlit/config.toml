# Dashboard theme (uv run streamlit run dashboard/app.py). Light palette on a warm paper ground;
# night mode is a sidebar toggle (dashboard/ui.py rewrites these options and every page colour).
[theme]
base = "light"
primaryColor = "#3346b8"
backgroundColor = "#f8f8f6"
secondaryBackgroundColor = "#f0f1f4"
textColor = "#16181d"
linkColor = "#3346b8"
borderColor = "#e2e4e9"
dataframeBorderColor = "#e2e4e9"
dataframeHeaderBackgroundColor = "#f1f2ef"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
baseFontSize = 15
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap"
headingFont = "Inter Tight:https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
codeBackgroundColor = "#f0f1f4"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

[theme.sidebar]
backgroundColor = "#f1f2ef"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
