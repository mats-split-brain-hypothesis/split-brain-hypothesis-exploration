[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "umot"
version = "0.0.0"
description = "Surfacing unverbalized motivations in Qwen3.6-27B with activation readers (J-lens, NLA, oracle/modulation lens)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jlens",
    "torch",
    "transformers>=5.5",
    "peft>=0.14",
    "accelerate",
    "huggingface_hub",
    "numpy",
    "pyyaml",
    # WorkspaceBench's own runtime deps: the bench is installed --no-deps
    # from third_party/ (tools/bootstrap.sh), so they are declared here.
    "openai>=1.40",
    "anthropic>=1.0",
    "pydra-config>=0.0.17",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "ipykernel",
    "matplotlib",
    "datasets",
]
# The Streamlit dashboard (dashboard/app.py).
dash = [
    "streamlit>=1.64.0",
    "plotly>=7.1.0",
]

[tool.uv]
default-groups = ["dev", "dash"]

# Upstream J-lens package, pinned to a commit (same pin as jlens-edits).
[tool.uv.sources]
jlens = { git = "https://github.com/anthropics/jacobian-lens", rev = "581d398613e5602a5af361e1c34d3a92ea82ba8e" }
# PyPI's Windows torch wheel is CPU-only; a Windows collaborator gets the CUDA 13.0
# build. Linux (the pod) and macOS use the PyPI wheel.
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/umot"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "dashboard"]
extend-exclude = ["notes", "third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
# Typographic minus signs, primes and arrows are intended in the dashboard's copy.
"dashboard/**" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["umot", "catalog", "charts", "figures", "plan", "sources", "ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: needs a real model download or a GPU; deselect with -m 'not slow'",
]
