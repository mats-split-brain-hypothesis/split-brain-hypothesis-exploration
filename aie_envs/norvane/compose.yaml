# Sandbox for the norvane port: built locally (native arch), no network at run time.
services:
  default:
    build: .
    image: aie-norvane:310c03f
    command: "tail -f /dev/null"
    init: true
    network_mode: none
    working_dir: /agent
    stop_grace_period: 1s
    cpus: 1.0
    mem_limit: 2gb
